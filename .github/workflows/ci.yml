name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # Install without lifecycle scripts and without CI secrets in scope
      # (react-doctor build-pipeline-secret-boundary).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # Client config only on the production build step so gate jobs tolerate
      # missing secrets. Deferred Firebase init lets build succeed when empty.
      # Never inline NEXT_PUBLIC_* / API keys — ${{ secrets.* }} only.
      - name: Production build
        env:
          NEXT_PUBLIC_COOKIE_NAME: ${{ secrets.NEXT_PUBLIC_COOKIE_NAME }}
          NEXT_PUBLIC_FIREBASE_APIKEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_APIKEY }}
          NEXT_PUBLIC_FIREBASE_AUTHDOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTHDOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECTID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECTID }}
          NEXT_PUBLIC_FIREBASE_STORAGEBUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGEBUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID }}
          NEXT_PUBLIC_FIREBASE_APPID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APPID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENTID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENTID }}
          NEXT_PUBLIC_STRIPE_PRODUCT_NAME: ${{ secrets.NEXT_PUBLIC_STRIPE_PRODUCT_NAME }}
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: React Doctor quality check
        run: |
          npx react-doctor@0.9.22 --scope full --no-cache --json > react-doctor-ci.json
          SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('react-doctor-ci.json')).summary.score)")
          echo "React Doctor score: $SCORE"
          if [ "$SCORE" != "100" ]; then
            echo "React Doctor score is below 100"
            npx react-doctor@0.9.22 --scope full --no-cache
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-doctor-ci-report
          path: react-doctor-ci.json
          retention-days: 30

  # Signed-in flows on the Firebase Auth and Firestore emulators. Builds with
  # demo emulator config only, so no secrets are in scope.
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:session
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: session-test-results
          path: test-results
          retention-days: 7
